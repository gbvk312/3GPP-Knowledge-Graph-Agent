[project]
name = "threegpp-knowledge-graph-agent"
version = "0.1.0"
description = "3GPP Knowledge Graph Agent - AWS CDK Infrastructure"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "moto>=5.0",
    "boto3>=1.34",
    "boto3-stubs[bedrock,bedrock-agent,bedrock-runtime,dynamodb,s3,textract]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra", "lambdas"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "lambdas", "lambdas/shared/python"]

