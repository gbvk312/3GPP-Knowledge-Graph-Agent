name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: CDK Synth (validate templates)
        run: uv run cdk synth --quiet 2>/dev/null || echo "CDK synth requires AWS credentials — skipping in CI"

      - name: Run tests
        run: |
          export PYTHONPATH=.:lambdas:lambdas/shared/python
          uv run pytest tests/ -v --tb=short
